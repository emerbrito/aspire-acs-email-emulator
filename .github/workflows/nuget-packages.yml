name: NuGet packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the packages to NuGet.org after validation
        required: true
        default: false
        type: boolean

concurrency:
  group: nuget-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  IMAGE_NAME: ghcr.io/emerbrito/aspire-acs-email-emulator
  SOLUTION: src/EmBrito.Aspire.Azure.CommunicationServices.Email.slnx
  HOSTING_PROJECT: src/EmBrito.Aspire.Hosting.Azure.CommunicationServices.Email/EmBrito.Aspire.Hosting.Azure.CommunicationServices.Email.csproj
  CLIENT_PROJECT: src/EmBrito.Aspire.Azure.CommunicationServices.Email/EmBrito.Aspire.Azure.CommunicationServices.Email.csproj
  PACKAGE_OUTPUT: artifacts/packages
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  validate:
    name: Build, test, and pack
    outputs:
      version: ${{ steps.version.outputs.value }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: src/global.json

      - name: Determine package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          HOSTING_VERSION="$(dotnet msbuild "$HOSTING_PROJECT" -getProperty:PackageVersion -nologo)"
          CLIENT_VERSION="$(dotnet msbuild "$CLIENT_PROJECT" -getProperty:PackageVersion -nologo)"

          if [[ "$HOSTING_VERSION" != "$CLIENT_VERSION" ]]; then
            echo "::error::Package versions differ. Hosting='$HOSTING_VERSION', Client='$CLIENT_VERSION'."
            exit 1
          fi

          if [[ ! "$HOSTING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The centrally configured version '$HOSTING_VERSION' is not SemVer-compatible."
            exit 1
          fi

          echo "value=$HOSTING_VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $HOSTING_VERSION"

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Verify formatting
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test
        run: dotnet test "$SOLUTION" --configuration Release --no-build --no-restore

      - name: Pack NuGet packages
        run: |
          dotnet pack "$HOSTING_PROJECT" \
            --configuration Release \
            --no-build \
            --no-restore \
            --output "$PACKAGE_OUTPUT"
          dotnet pack "$CLIENT_PROJECT" \
            --configuration Release \
            --no-build \
            --no-restore \
            --output "$PACKAGE_OUTPUT"

      - name: Verify expected packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail

          test -f "$PACKAGE_OUTPUT/EmBrito.Aspire.Hosting.Azure.CommunicationServices.Email.$VERSION.nupkg"
          test -f "$PACKAGE_OUTPUT/EmBrito.Aspire.Azure.CommunicationServices.Email.$VERSION.nupkg"
          find "$PACKAGE_OUTPUT" -maxdepth 1 -type f -name "*.nupkg" -print

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages-${{ steps.version.outputs.value }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet.org
    needs: validate
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: nuget-release
      deployment: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require the default branch
        shell: bash
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            echo "::error::Publishing is allowed only from the repository's default branch."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: src/global.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Verify matching emulator image exists
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" >/dev/null
          echo "Found emulator image: $IMAGE_NAME:$VERSION"

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Pack NuGet packages
        run: |
          dotnet pack "$HOSTING_PROJECT" \
            --configuration Release \
            --no-build \
            --no-restore \
            --output "$PACKAGE_OUTPUT"
          dotnet pack "$CLIENT_PROJECT" \
            --configuration Release \
            --no-build \
            --no-restore \
            --output "$PACKAGE_OUTPUT"

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail

          for package in "$PACKAGE_OUTPUT"/*.nupkg; do
            dotnet nuget push "$package" --source "$NUGET_SOURCE" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          done
